# Architecture Constraints for studio
# 项目特定的架构约束规则

rules:
  # ============================================================================
  # 规则 1: studio-shared 零业务逻辑
  # ============================================================================
  - id: no-business-in-shared
    type: forbidden-pattern
    severity: error
    scope: "**/packages/studio-shared/**/*"
    patterns:
      - "salary"
      - "balance"
      - "settlement"
      - "payment"
      - "debt"
      - "advance"
      - "经济"
      - "工资"
      - "结算"
      - "支付"
    message: |
      ❌ studio-shared 不能包含业务逻辑！

      studio-shared 是通用基础设施层，业务逻辑应在对应的 studio-* 包中实现。

  # ============================================================================
  # 规则 2: 复用优先检查
  # ============================================================================
  - id: reuse-first-check
    type: file-count
    severity: warning
    threshold: 3
    message: |
      ⚠️ 修改超过 3 个文件，必须提供复用检查报告！

      请在 PR 描述中添加以下部分：

      ## 🔍 复用检查结果

      ### 可复用代码检查
      | 能力 | 位置 | 复用度 | 决策 |
      |------|------|:------:|------|
      | ... | ... | ... | 复用/新建 |

      ### 结论
      - 直接复用: X 个
      - 需要新建: Y 个（原因：...）

  # ============================================================================
  # 规则 3: 文档变更同步
  # ============================================================================
  - id: doc-sync-required
    type: custom
    severity: warning
    script: "scripts/check-doc-sync.sh"
    message: |
      ⚠️ 代码变更可能影响架构文档，请检查是否需要同步更新！
