checkpoints:
  - id: build-success
    name: 构建成功
    checks:
      - id: build-command
        type: command_success
        config:
          command: npm run build
        message: 构建命令必须成功执行
  - id: test-pass
    name: 测试通过
    checks:
      - id: test-command
        type: command_success
        config:
          command: npm test
        message: 测试命令必须成功执行
  - id: no-console
    name: 无 console.log
    checks:
      - id: check-console
        type: output_not_contains
        config:
          command: grep -r "console.log" src/ || true
          expected: ''
        message: 源代码中不应包含 console.log
  - id: no-empty-files
    name: 无空文件
    checks:
      - id: check-empty-src
        type: command_success
        config:
          command: "! find packages/ apps/ scripts/ -name '*.ts' -size 0 | grep -q ."
        message: 关键源码文件不能为空（0 字节），防止 sed/批量操作误清空
