custom_constraints:
  no_redis_import:
    id: no_redis_import
    level: iron_law
    rule: NO REDIS/IREDIS IMPORTS
    message: 禁止引入 Redis/ioredis 依赖。项目使用 MemoryStore（studio-shared）替代
    trigger:
      - code_implementation
    description: B0-002 已完成 Redis→MemoryStore 迁移。任何新代码不得引入 redis/ioredis 包或 Redis 连接逻辑
    promptInjection: 禁止引入 Redis/ioredis 依赖。项目使用 MemoryStore（studio-shared）替代。任何新代码不得引入 redis/ioredis 包或 Redis 连接逻辑。
  prisma_schema_needs_migration:
    id: prisma_schema_needs_migration
    level: iron_law
    rule: PRISMA SCHEMA CHANGES REQUIRE MIGRATION
    message: 修改 schema.prisma 必须同时创建 migration 文件（prisma migrate dev --name <desc>）
    trigger:
      - code_implementation
    description: schema 变更不带 migration 会导致生产环境 DB 不同步
    promptInjection: 修改 schema.prisma 必须同时创建 migration 文件（prisma migrate dev --name <desc>）。schema 变更不带 migration 会导致生产环境 DB 不同步。
    retired:
      at: '2026-08-16T05:14:06.058Z'
      reason: ''
      stats:
        total: 4
        fail: 0
        failRate: 0
  monorepo_app_boundary:
    id: monorepo_app_boundary
    level: guideline
    rule: NO CROSS-APP IMPORTS
    message: apps/ 之间禁止直接导入。共享逻辑必须提取到 packages/
    trigger:
      - code_implementation
    description: apps/api 和 apps/web 不能互相 import。公共逻辑放 packages/studio-shared 或对应 package
    promptInjection: apps/ 之间禁止直接导入。共享逻辑必须提取到 packages/（公共逻辑放 packages/studio-shared 或对应 package）。
  agent_topology_agnostic:
    id: agent_topology_agnostic
    level: guideline
    rule: AGENT METHODS MUST BE TOPOLOGY-AGNOSTIC
    message: Agent 方法（reviewDiff/mergeBranches/pushBranch）必须用参数化 ref，禁止硬编码 branch 名
    trigger:
      - code_implementation
    description: 2026-05-23 解耦决策：Agent 接口不假设分支拓扑，diff/merge 用参数化 refs
    promptInjection: Agent 方法（reviewDiff/mergeBranches/pushBranch）必须用参数化 ref，禁止硬编码 branch 名。Agent 接口不假设分支拓扑。
  two_stage_review_required:
    id: two_stage_review_required
    level: iron_law
    rule: REVIEW MUST COVER SPEC COMPLIANCE BEFORE CODE QUALITY
    message: 审查必须两阶段：先验证规范合规，再检查代码质量
    trigger: code_implementation
    description: |
      代码审查必须分两阶段进行：

      【Stage 1: 规范合规审查】
      - 逐条对照验收标准(AC)验证
      - 重新运行 Executor 的测试，确认通过
      - 审计测试质量（是否只测了 happy path）
      - 补写边界条件测试，验证是否失败

      【Stage 2: 代码质量审查】
      - 仅在 Stage 1 全部通过后进入
      - 安全性检查（注入、泄露、权限）
      - 可读性检查（命名、结构、DRY）
      - 类型安全（type check、lint）
    promptInjection: >-
      代码审查必须分两阶段：① 规范合规审查 — 逐条对照验收标准(AC)验证实现是否满足需求，重新运行测试，审计测试质量并补写边界用例；② 代码质量审查 — 仅在 Stage 1 全部通过后，检查安全性、可读性、类型安全。Stage
      1 不通过则不得进入 Stage 2。
  prefer_worktree:
    id: prefer_worktree
    level: guideline
    rule: USE WORKTREE FOR HIGH-RISK CHANGES
    message: 高风险改动应在 worktree 中进行
    trigger:
      - code_implementation
    description: |
      高风险改动应在隔离的 worktree 中进行。

      【何时需要 worktree】
      - 新功能开发（新增模块/API）
      - 跨模块改动（>3 文件）
      - 基础设施变更（CI/CD、依赖）

      【何时不需要】
      - 配置文件修改
      - 单文件 bug fix
      - 外科手术式修复（typo、missing import）

      【原因】
      - 隔离风险：worktree 中的改动不会影响主工作区
      - 安全回滚：删除 worktree 即可放弃改动
      - 并行开发：多个任务可同时在不同 worktree 中进行
    promptInjection: 高风险改动（新功能、跨模块、基础设施）应在 worktree 中进行。配置修改、单文件 fix 可直接编辑。
  no_completion_without_verification:
    id: no_completion_without_verification
    level: iron_law
    rule: NO COMPLETION CLAIM WITHOUT FRESH VERIFICATION
    message: 声明完成前必须重跑新鲜的验证命令（受影响测试 + type check），全量测试由 CI/ship 兜底
    trigger:
      - code_implementation
    description: 2026-08-14 决策：受影响测试口径对齐 studio-deploy-quick（vitest run --changed origin/master），全量留 CI/ship，避免每票 4.5min 全量空转
    promptInjection: >-
      在声明任务完成前，必须重新运行新鲜的验证命令——受改动影响的测试（vitest run --changed origin/master）+ type check，使用新鲜的输出作为完成证据，不得复用旧结果。全量测试由 CI /
      studio-ship 兜底。
