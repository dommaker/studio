# 项目专属约束 (2026-05-09)
#
# 扩展 @dommaker/harness 内置的 8 Iron Laws + 13 Guidelines

custom_constraints:

  # ── Model Tier 校验 ──
  model_tier_schema_change:
    id: model_tier_schema_change
    level: guideline
    rule: "SCHEMA CHANGES REQUIRE PREMIUM MODEL"
    message: "schema/migration/auth 变更应使用 premium 模型，flash 禁止用于此类变更"
    trigger: ["code_implementation"]
    description: "schema/auth/financial 变更应使用 premium 模型，flash tier 在复杂架构变更时成功率不足"

  # ── 审查必须通过 ──
  review_required_for_auth:
    id: review_required_for_auth
    level: guideline
    rule: "AUTH CHANGES REQUIRE REVIEW PASS"
    message: "auth/login/token/session 相关变更必须通过 Reviewer 审查，不得跳过"
    trigger: ["code_implementation"]
    description: "安全相关变更必须经过多立场审查（质疑者/架构师/执行者/实用主义者），禁止 bypass"

  # ── 禁止静默失败 ──
  no_silent_error_swallow:
    id: no_silent_error_swallow
    level: tip
    rule: "ERRORS MUST BE LOGGED WITH CONTEXT"
    message: "catch 块不能为空，至少要 logger.warn() 输出错误上下文"
    trigger: ["code_implementation"]
    description: "静默 catch 导致故障完全不可见。最低要求：logger.warn('context', { error: String(e) })"

  # ── 禁止硬编码端口/路径 ──
  no_hardcoded_infra:
    id: no_hardcoded_infra
    level: guideline
    rule: "NO HARDCODED PORTS, PATHS, HOSTS, DOMAINS, OR IDENTITIES"
    message: "端口/路径/主机/域名/身份标识 必须从环境变量读取，不得硬编码"
    trigger: ["code_implementation"]
    description: "硬编码基础设施参数导致环境迁移困难。禁止硬编码端口、文件路径、主机名、域名、默认邮箱/密码。使用 process.env.X || default 模式。2026-05-21 故障: AuthModal 硬编码 admin@agent-studio.local 导致登录失败"

  # ── 禁止下游兼容掩盖上游问题 ──
  no_fallback_without_root_cause:
    id: no_fallback_without_root_cause
    level: guideline
    rule: "BEFORE ADDING FALLBACK, TRACE UPSTREAM FIRST"
    message: "禁止用兼容/兜底/fallback 掩盖上游数据异常。遇到空值/异常数据，先追根因——谁产生的？为什么是空？——再决定修上游还是加兜底"
    trigger: ["code_implementation"]
    description: "2026-05-21 故障分析：连续 3 次 agent 执行卡在 REQUIREMENTS.md 空模板。第一次修复：兼容空 AC 写'从任务描述中推断'。第二次修复：传 stepTitle 做 fallback。第三次才找到根因：Markdown parser 把实现步骤当成 AC 组。正确做法：第一次就应该 trace '为什么 AC 是空？谁写入的？'"

# ── 内置约束例外 ──
# 暂无需要例外的内置约束
