preset: standard
enabled: true
ironLaws:
  enforceErrors: true
  warnWarnings: true
validators:
  checkpoint: true
  passesGate: true
  cso: false
harness:
  version: 0.16.2
governance:
  # CONTEXT.md 覆盖要求：与 detectSourceRoots 相同的 48 个源码根
  # （同时作为 sync-docs 的 CAPABILITIES.md 扫描根，勿删减，否则 --check 会误判）
  context_files:
    enabled: true
    required_dirs:
      - apps/api/src/modules/admin
      - apps/api/src/modules/agent-configs
      - apps/api/src/modules/agents
      - apps/api/src/modules/audit
      - apps/api/src/modules/audit-logs
      - apps/api/src/modules/auth
      - apps/api/src/modules/builtin-tools
      - apps/api/src/modules/capabilities
      - apps/api/src/modules/channels
      - apps/api/src/modules/dingtalk
      - apps/api/src/modules/discord
      - apps/api/src/modules/environments
      - apps/api/src/modules/events
      - apps/api/src/modules/evolution
      - apps/api/src/modules/executions
      - apps/api/src/modules/harness
      - apps/api/src/modules/knowledge
      - apps/api/src/modules/lark
      - apps/api/src/modules/llm
      - apps/api/src/modules/mcp
      - apps/api/src/modules/monitoring
      - apps/api/src/modules/notifications
      - apps/api/src/modules/outbound-notify
      - apps/api/src/modules/outputs
      - apps/api/src/modules/pmo
      - apps/api/src/modules/projects
      - apps/api/src/modules/requirements
      - apps/api/src/modules/runtime-config
      - apps/api/src/modules/sdd
      - apps/api/src/modules/shared
      - apps/api/src/modules/skills
      - apps/api/src/modules/spec-reviews
      - apps/api/src/modules/specs
      - apps/api/src/modules/triage
      - apps/api/src/modules/triggers
      - apps/api/src/modules/wiki
      - apps/api/src/modules/workspaces
      - apps/api/src/modules/workunit
      - apps/web/src
      - packages/studio-agent/src
      - packages/studio-audit/src
      - packages/studio-capability/src
      - packages/studio-monitor/src
      - packages/studio-notification/src
      - packages/studio-shared/src
      - packages/studio-skill/src
      - packages/studio-spec/src
      - packages/studio-task/src
  # 声明式文档新鲜度门禁（harness FreshnessRunner，零 LLM，npx harness check 消费）
  doc_freshness:
    enabled: true
    checks:
      # CHANGELOG.md [x.y.z] ↔ package.json version（studio 当前 CHANGELOG
      # 为日期格式，该检查在出现 semver 版本段后自动生效）
      - type: changelog_version
      # 上述 required_dirs 全部必须有 CONTEXT.md
      - type: context_docs
      # AGENTS.md 模块索引（AUTO-GENERATED:modules 区段，pnpm gen:agents-md 生成）
      # ↔ apps/api/src/modules + packages 双向覆盖
      - type: doc_dir_check
        doc: AGENTS.md
        section: 模块索引
        dir_pattern: '`((?:apps|packages)/[^`|]+)`'
        exclude:
          - __tests__
          - node_modules
          - dist
      # README.md 文档地图的链接目标必须真实存在（单向：doc → fs）
      - type: doc_dir_check
        doc: README.md
        section: 文档地图
        dir_pattern: '\]\(([^)]+)\)'
        skip_reverse_check: true
