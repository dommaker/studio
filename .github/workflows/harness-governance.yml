name: Harness Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dommaker/harness
          path: harness-src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Symlink harness for pnpm link override
        run: ln -s "$(pwd)/harness-src" ../harness

      - name: Build harness
        run: cd harness-src && pnpm install --ignore-workspace && pnpm build

      - name: Install dependencies
        run: pnpm install

      - name: Constraint check
        run: npx harness check

      - name: Quality gate
        run: npx harness passes-gate

      - name: Check docs freshness
        run: npx harness sync-docs --check
        continue-on-error: true
