name: Capability Sync Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check capability sync
        run: |
          # 检测核心文件变更
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E 'src/core/|src/modules/|frontend/src/components/|frontend/src/pages/|frontend/src/stores/' || true)

          if [ -n "$CHANGED" ]; then
            echo "检测到核心文件变更:"
            echo "$CHANGED"

            # 检查 CAPABILITIES.md 是否更新
            CAP_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep 'CAPABILITIES.md' || true)

            if [ -z "$CAP_CHANGED" ]; then
              echo ""
              echo "❌ 铁律警告：核心文件已变更但 CAPABILITIES.md 未更新"
              echo ""
              echo "请在 CAPABILITIES.md 中同步更新功能描述。"
              echo "这是铁律要求，确保功能清单与代码保持一致。"
              echo ""
              exit 1
            fi

            echo "✅ CAPABILITIES.md 已同步更新"
          else
            echo "✅ 无核心文件变更，跳过检查"
          fi
