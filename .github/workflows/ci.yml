name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SKIP_E2E_SERVER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dommaker/harness
          path: harness-src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@latest
      - run: ln -s "$(pwd)/harness-src" ../harness
      - run: cd harness-src && pnpm install --ignore-workspace && pnpm build
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - name: Governance
        run: npx harness check && npx harness sync-docs --check
        continue-on-error: true
