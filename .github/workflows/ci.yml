name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SKIP_E2E_SERVER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@latest
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # 顺序约束：本步骤必须在 pnpm test 之后串行执行（不可提前或并行）。
      # 历史原因：旧版 sync-docs 在 AGENTS.md 写入知识库条数（harness ≤0.16.5），测试写知识库导致计数抖动误报；
      # 0.16.6 起条数已移除、测试也已隔离，但保留串行作为防御（2026-07-27 治理共识，见 docs/plans/2026-07-27-agents-md-skill-governance.md）。
      # 步骤内顺序：sync-docs 必须在 check 之前——≥0.16.8 的 sync-docs 会主动剔除 CAPABILITIES.md 幽灵条目（含 basename 碰撞），
      # 先 sync 自愈再 check，最后 --check 验证收敛；check 若跑在 sync 前，幽灵会先撞 check，自愈永远轮不到（2026-08-08）。
      - name: Governance
        run: npx harness sync-docs --agents && npx harness check && npx harness sync-docs --check --agents
