name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SKIP_E2E_SERVER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@latest
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # 顺序约束：本步骤必须在 pnpm test 之后串行执行（不可提前或并行）——
      # sync-docs --check --agents 的期望值含知识库条数等动态计数，测试会写知识库，
      # 并行/乱序会导致计数抖动误报（2026-07-27 治理共识，见 docs/plans/2026-07-27-agents-md-skill-governance.md）。
      - name: Governance
        run: npx harness check && npx harness sync-docs --check --agents
