name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  hardcoded-check:
    name: 硬编码检查
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: 检查硬编码 API 地址
        run: |
          chmod +x scripts/check-hardcoded-api.sh
          ./scripts/check-hardcoded-api.sh

  backend:
    name: 后端构建测试
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      
      - name: Run tests
        run: npm test --if-present
      
      - name: Lint
        run: npm run lint --if-present

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

  typecheck:
    name: TypeScript 类型检查
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npx tsc --noEmit

  spec-validate:
    name: Spec 验证
    runs-on: ubuntu-latest
    if: hashFiles('specs/**', 'ARCHITECTURE.md') != ''
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install harness
        run: npm install -g @dommaker/harness@^0.8.3
      
      - name: Validate Specs
        run: harness spec validate --project-path .
