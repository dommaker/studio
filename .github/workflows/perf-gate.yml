name: Perf Gate

# 性能回归门（#673）：不进日常 CI（不挂 push/PR），每周定时 + 手动触发。
# 跑 scripts/perf/gate.ts：隔离数据区 bench → 对比 scripts/perf/baseline.json，
# 回归 >20%（含 5ms 绝对噪声地板）exit 1 即红。红了 = 需要人看的显式报警：
# 先排除异机噪声（baseline.json 锚定参考机，见 scripts/perf/README.md「基线重锚」），
# 再查真实退化。

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # 每周一 03:17 UTC

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@latest
      - run: pnpm install --no-frozen-lockfile
      - name: Bench + regression gate (>20% red)
        run: pnpm perf:gate
