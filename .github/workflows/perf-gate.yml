name: Perf Gate

# 性能回归门（#673）：不进日常 CI（不挂 push/PR），每周定时 + 手动触发。
# PERF-07：隔离空区 bench + 非空规模 + 浏览器长会话，correctness/latency/soak 分类；
# p50/p95 多轮相对回归 + 绝对预算判红，max 仅诊断。

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # 每周一 03:17 UTC

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Enable the packageManager-pinned pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build browser artifact
        run: pnpm build:web
      - name: Install Chromium for long-session scenarios
        run: pnpm exec playwright install --with-deps chromium
      - name: Scale + browser + legacy regression gate
        run: pnpm perf:gate
