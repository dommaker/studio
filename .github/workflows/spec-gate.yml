name: Spec Gate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'projects/**'
      - '.architect/**'
      - 'ARCHITECTURE.md'
  push:
    branches: [main]

jobs:
  spec-gate:
    name: Spec 门禁检查
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史做 diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install @dommaker/harness@^0.8.3

      - name: Run Spec Gate
        run: npx tsx scripts/spec-gate.ts --verbose
        env:
          CI: true

      - name: Comment PR (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Spec 门禁检查失败**

              请修复以下问题后再提交：
              
              1. 架构约束检查：\`pnpm architect:check\`
              2. 代码注释检查：\`pnpm spec:annotate:check\`
              3. 文档同步检查：\`pnpm doc:sync-check\`
              4. 查看详细错误：点击上方 Checks → Spec Gate

              参考文档：
              - [代码注释规范](docs/code-annotation-guideline.md)
              - [架构约束](.architect/rules.yml)`
            });

  # 可选：生成 Spec 报告
  spec-report:
    name: 生成 Spec 报告
    runs-on: ubuntu-latest
    needs: spec-gate
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Spec Coverage Report
        run: |
          echo "## Spec 覆盖报告" > spec-report.md
          echo "" >> spec-report.md
          echo "| Spec ID | 状态 | 实现文件 |" >> spec-report.md
          echo "|---------|:----:|----------|" >> spec-report.md
          # TODO: 实际生成报告
          echo "| AR-001 | ✅ | src/core/performance.ts |" >> spec-report.md

      - name: Comment PR with report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('spec-report.md', 'utf-8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
