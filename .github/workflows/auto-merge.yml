name: Auto Merge

# CI 通过后自动启用 auto-merge（避免 CI pending 时设置导致漏合并）
# 首次由 studio-ship 脚本手动设置，后续由本 workflow 在 CI 通过后重新触发
# 优先使用 PR_TOKEN secret（有 merge 权限的 PAT），缺省时回退到 GITHUB_TOKEN

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge on all open PRs from the head branch
        run: |
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          echo "CI passed for branch: $HEAD_BRANCH"
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "$HEAD_BRANCH" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            gh pr merge "$PR_NUMBER" --auto --merge --delete-branch -R "${{ github.repository }}"
            echo "Auto-merge enabled for PR #$PR_NUMBER"
          else
            echo "No open PR for branch $HEAD_BRANCH, skipping"
          fi
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || github.token }}
