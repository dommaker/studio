name: Auto Merge

# 当 PR 被创建或更新时，自动启用 auto-merge
# CI 全部通过后 GitHub 会自动合并 PR
# 优先使用 PR_TOKEN secret（有 merge 权限的 PAT），缺省时回退到 GITHUB_TOKEN

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        # 无 actions/checkout，gh 需要 -R 显式指定仓库（否则 fatal: not a git repository）
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --merge --delete-branch -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || github.token }}
